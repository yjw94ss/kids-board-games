<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#606c38">
  <meta name="description" content="快乐点数棋与经典飞行棋：亲子同屏掷骰子，练习点数、认识汉字。支持1至4人轮流玩。">
  <title>一起走棋 · 亲子棋盘</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="pieces.css?v=2">
</head>
<body>
  <div class="app">
    <header class="site-header">
      <a class="brand" href="./" aria-label="一起走棋首页">
        <svg class="brand-mark" viewBox="0 0 44 44" aria-hidden="true"><rect x="3" y="3" width="38" height="38" rx="12" fill="currentColor"/><g fill="#e8dcc7"><circle cx="15" cy="15" r="3"/><circle cx="29" cy="15" r="3"/><circle cx="22" cy="22" r="3"/><circle cx="15" cy="29" r="3"/><circle cx="29" cy="29" r="3"/></g></svg>
        <span>一起走棋<small>亲子棋盘</small></span>
      </a>
      <span class="header-note">一颗骰子，一起长大。</span>
      <button id="sound" class="quiet-button" type="button" aria-pressed="true">朗读：开</button>
    </header>

    <nav class="board-tabs" aria-label="选择棋盘">
      <button class="board-tab selected" id="tab-counting" data-board="counting" aria-pressed="true">
        <img src="assets/counting.png" alt="" width="92" height="65">
        <span><strong>快乐点数棋</strong><small>看点数 · 数格子</small></span>
        <span class="tab-dot" aria-hidden="true"></span>
      </button>
      <button class="board-tab" id="tab-literacy" data-board="literacy" aria-pressed="false">
        <img src="assets/literacy.png" alt="" width="92" height="65">
        <span><strong>经典飞行棋</strong><small>认汉字 · 爬梯子</small></span>
        <span class="tab-dot" aria-hidden="true"></span>
      </button>
    </nav>

    <main>
      <div class="game-heading">
        <div><p class="eyebrow" id="board-subtitle">数一数，向前走</p><h1 id="board-title">快乐点数棋</h1></div>
        <div class="heading-actions">
          <button class="quiet-button" id="route-toggle" aria-pressed="false">路线：关</button>
          <button class="quiet-button" id="zoom-open">放大棋盘</button>
        </div>
      </div>
      <div class="game-layout">
        <section class="board-panel" aria-label="游戏棋盘">
          <div class="board-meta"><span id="route-caption">左上出发，沿蛇形路线到左下</span><span id="round-count">第 1 回合</span></div>
          <div id="board-mount">
            <div id="board-surface" class="board-surface">
              <img id="board-image" src="assets/counting.png" width="1491" height="1055" alt="快乐点数棋，四排动物格子由两侧交替连接。">
              <svg id="route-svg" viewBox="0 0 1491 1055" aria-hidden="true" hidden></svg>
              <div id="cell-layer"></div>
              <div id="piece-layer"></div>
              <div id="start-badge" class="endpoint start">起点</div>
              <div id="finish-badge" class="endpoint finish">终点</div>
            </div>
          </div>
          <div class="board-foot"><span class="touch-hint">点棋盘格子，可以听朗读</span><span id="saved-status">进度自动保存在此设备</span></div>
        </section>

        <aside class="play-panel" aria-label="掷骰子和玩家信息">
          <div class="turn-line"><span class="player-color" id="turn-color"></span><strong id="turn-title">轮到小橘</strong><span id="turn-number">1 号</span></div>
          <button id="roll" class="roll-button" type="button" aria-label="掷骰子">
            <span class="die" id="die" role="img" aria-label="等待掷骰子"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
            <span id="roll-label">掷骰子</span>
          </button>
          <p id="status" class="status" role="status" aria-live="polite">小橘先来。点一下骰子出发吧！</p>
          <div class="landed-card" id="landed-card" hidden>
            <span id="landed-caption">来到这里</span><strong id="landed-word"></strong>
            <button id="read-again" class="quiet-button" type="button">再读一次</button>
          </div>
          <div id="players" class="players" aria-label="玩家进度"></div>
          <div class="game-settings"><label for="player-count">一起玩的人数</label><select id="player-count"><option value="1">1 人练习</option><option value="2" selected>2 人一起玩</option><option value="3">3 人一起玩</option><option value="4">4 人一起玩</option></select></div>
          <button id="restart" class="restart-button">重新开始</button>
        </aside>
      </div>

      <section class="under-board">
        <details class="rules" open><summary>怎么玩</summary><div id="rules-content"></div></details>
        <section class="history-panel" aria-label="走棋记录"><h2>刚刚走过</h2><ol id="history"><li class="empty-history">掷出第一颗骰子，留下足迹。</li></ol></section>
      </section>
    </main>
    <footer>同屏轮流玩 · 无需登录<span>建议由大人陪伴，一起数、一起读</span></footer>
  </div>

  <dialog id="reset-dialog" class="reset-dialog"><form method="dialog"><h2>开始新的一局？</h2><p>当前棋盘的棋子会回到起点。</p><div class="dialog-actions"><button value="cancel" class="quiet-button">继续这一局</button><button value="confirm" class="primary-button">开始新一局</button></div></form></dialog>
  <dialog id="zoom-dialog" class="zoom-dialog"><div class="zoom-toolbar"><strong>放大棋盘</strong><span>小屏可左右滑动查看</span><button id="zoom-close" class="primary-button">返回游戏</button></div><div id="zoom-mount" class="zoom-mount"></div></dialog>
  <noscript><p>请在浏览器中开启 JavaScript 后玩游戏。</p></noscript>
  <script type="module" src="app.js?v=2"></script>
</body>
</html>
